name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate help index
        run: bash make-help.sh

      - name: Commit help if changed
        run: |
          if ! git diff --quiet help; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add help
            git commit -m "regenerate help index [skip ci]"
            git push
          fi

      - name: Build colorized site
        run: |
          mkdir -p _site
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              make-help.sh|colorize.sh) ;;
              # Scripts must ship byte-for-byte: colorize.sh would inject ANSI
              # escapes and the shell would choke on the very first line.
              *.html|CNAME|README.md|*.sh|*.ps1) cp "$f" _site/ ;;
              *) bash colorize.sh "$f" > "_site/$f" ;;
            esac
          done

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
