[APP]
; Web UI listen address/port. 0.0.0.0 = reachable from your phone on the LAN.
listen_host = 0.0.0.0
listen_port = 8080
cmc_min = 0
cmc_max = 16

[WIFI]
; When True, setup.sh configures the Pi as its own Wi-Fi access point so
; players connect straight to the Pi (no home network needed at the table).
; While in AP mode the Pi has no internet over Wi-Fi, so card database
; refreshes are skipped (existing data keeps working).
ap_enabled = False
ap_ssid = MomirPrinter
; WPA2 password, 8-63 characters.
ap_password = summonbig
ap_interface = wlan0

[ACCESS]
; When True, new devices must be approved by the host before they can print.
; The host unlocks host controls on their own phone with admin_pin.
access_control_enabled = True
; CHANGE THIS. 4-32 characters; the host enters it once on their device.
admin_pin = 1234
; Where approved/pending devices are remembered (survives restarts).
devices_path = ./devices.json

[FILESYSTEM]
cards_path = ./cards
art_path = ./cards/art
default_card_art_path = ./src/img/default_card_art.jpg
access_rights = 0o777

[LOGGING]
log_level = INFO
log_format = [%%(levelname)s] [%%(asctime)s] %%(name)s: %%(message)s
log_date_format = %%Y-%%m-%%d %%H:%%M:%%S

[PRINTER]
; bluetooth = ESC/POS over rfcomm (default for PT-210); usb = ESC/POS over USB.
connection_mode = bluetooth
; Bluetooth MAC of the printer (find it with: bluetoothctl scan on).
; setup.sh uses this to create the rfcomm binding at boot.
bluetooth_mac = 00:00:00:00:00:00
serial_port = /dev/rfcomm0
serial_baud_rate = 9600
; USB IDs (only used when connection_mode = usb; find them with lsusb).
vendor_id = 0x0000
product_id = 0x0000
paper_width_mm = 57
paper_width_chars = 32
card_art_enabled = True
qr_code_enabled = True
qr_code_size = 6
printer_profile = simple
; PT-210 print head is 384 dots wide; 380 leaves a safe margin.
printer_media_width_px = 380
min_title_spacing = 1
paragraph_spacing = \n\n
text_replacements_json = {"—":"-","–":"-","’":"'","“":"\"","”":"\"","•":"*"}

[SCRYFALL]
base_url = https://api.scryfall.com
bulk_data_endpoint = /bulk-data/oracle_cards
header_accept = application/json
header_user_agent = slade208/momir-pocket-printer
header_accept_encoding = gzip
request_delay_seconds = 0.05
max_retries = 3
art_width_px = 380
excluded_sets = funny,
                memorabilia,
                minigame,
                alchemy
excluded_layouts = token,
                   emblem,
                   art_series,
                   double_faced_token,
                   scheme,
                   planar,
                   phenomenon,
                   vanguard,
                   augment,
                   host
